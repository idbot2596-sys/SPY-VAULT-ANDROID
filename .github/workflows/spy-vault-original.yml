name: SPY VAULT Original Java Build with Real App Hider

'on':
  workflow_dispatch:
  push:
    paths:
      - SPY_VAULT_0.9.3_Source.zip
      - .github/workflows/spy-vault-original.yml

permissions:
  contents: read

jobs:
  build-original:
    name: Build SPY VAULT with launcher-level app hiding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract original source
        run: |
          set -euo pipefail
          unzip -q SPY_VAULT_0.9.3_Source.zip -d source
          test -f source/SPY_VAULT_0.9.3/app/src/main/java/com/spyvault/app/MainActivity.java

      - name: Add actual app drawer and hide controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("source/SPY_VAULT_0.9.3")
          app = root / "app"
          java = app / "src/main/java/com/spyvault/app/MainActivity.java"
          s = java.read_text()

          # Fix the known escaped-dot cloud session parser issue.
          s = s.replace('packed.split("\\\\.",2)', 'packed.split("\\.",2)')

          # Add the real App Hider entry to original settings.
          anchor = '        settingsRow("Appearance","Theme, accent colors and text size","◐",()->showAppearance());'
          if anchor not in s:
              raise SystemExit("Original Settings anchor not found")
          if 'settingsRow("App Hider"' not in s:
              s = s.replace(anchor, anchor + '\n        settingsRow("App Hider","Hide apps from the SPY VAULT app drawer","▣",()->showAppHider());')

          # Replace the old shortcut-only screen with the real launcher manager entry.
          start = s.find("              private void showAppHider() {")
          if start < 0:
              start = s.find("    private void showAppHider() {")
          if start >= 0:
              end = s.find("    private void openSpyVaultPrivacySettings()", start)
              if end < 0:
                  raise SystemExit("Could not find end of old App Hider methods")
              replacement = '''    private void showAppHider() {
                  initInner("App Hider","Manage which apps appear in the SPY VAULT launcher",()->showSettings());
                  card("REAL APP DRAWER","Browse installed launchable apps, hide selected apps from the SPY VAULT Home app drawer, and restore them whenever you want. To use this as your phone home screen, choose SPY VAULT Home as the default launcher.","ON DEVICE",null);
                  button("OPEN APP HIDER",()->startActivity(new Intent(this,AppHiderActivity.class)));
                  button("SET DEFAULT HOME LAUNCHER",()->{
                      try { startActivity(new Intent(android.provider.Settings.ACTION_HOME_SETTINGS)); }
                      catch(Exception e) { startActivity(new Intent(android.provider.Settings.ACTION_SETTINGS)); }
                  });
                  card("IMPORTANT LIMIT","Apps hidden here are removed only from the SPY VAULT launcher drawer. Android Settings, Play Store, and other launchers can still show installed apps. This does not silently disable or uninstall apps.","ANDROID LIMIT",null);
                  ghostButton("BACK TO SETTINGS",()->showSettings());
              }

      '''
              s = s[:start] + replacement + s[end:]
          else:
              # Insert when source does not already contain an App Hider screen.
              anchor2 = "    private void showSecurity() {"
              if anchor2 not in s: raise SystemExit("Could not find App Hider insertion point")
              s = s.replace(anchor2, '''    private void showAppHider() {
                  initInner("App Hider","Manage apps in the SPY VAULT launcher",()->showSettings());
                  button("OPEN APP HIDER",()->startActivity(new Intent(this,AppHiderActivity.class)));
                  button("SET DEFAULT HOME LAUNCHER",()->startActivity(new Intent(android.provider.Settings.ACTION_HOME_SETTINGS)));
              }

      ''' + anchor2)
          java.write_text(s)

          activity = r"""
          package com.spyvault.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.Drawable;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Set;

          public class AppHiderActivity extends Activity {
              private final int BG = Color.rgb(12,14,22);
              private final int PANEL = Color.rgb(25,28,42);
              private final int WHITE = Color.WHITE;
              private final int MUTED = Color.rgb(165,170,190);
              private final int PURPLE = Color.rgb(151,92,255);
              private LinearLayout list;
              private EditText search;
              private boolean showHidden = false;
              private List<ResolveInfo> apps = new ArrayList<>();
              private Set<String> hidden = new HashSet<>();

              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  hidden = new HashSet<>(getPreferences(0).getStringSet("hidden_packages", new HashSet<>()));
                  loadApps();
                  render();
              }

              private void loadApps() {
                  Intent query = new Intent(Intent.ACTION_MAIN, null);
                  query.addCategory(Intent.CATEGORY_LAUNCHER);
                  apps = getPackageManager().queryIntentActivities(query, 0);
                  final String own = getPackageName();
                  List<ResolveInfo> filtered = new ArrayList<>();
                  for (ResolveInfo ri : apps) {
                      if (ri.activityInfo == null || own.equals(ri.activityInfo.packageName)) continue;
                      filtered.add(ri);
                  }
                  Collections.sort(filtered, new Comparator<ResolveInfo>() {
                      @Override public int compare(ResolveInfo a, ResolveInfo b) {
                          return String.valueOf(a.loadLabel(getPackageManager())).compareToIgnoreCase(String.valueOf(b.loadLabel(getPackageManager())));
                      }
                  });
                  apps = filtered;
              }

              private int dp(float v) { return (int)(v * getResources().getDisplayMetrics().density + 0.5f); }
              private TextView text(String value, int size, int color, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(value); t.setTextSize(size); t.setTextColor(color);
                  if (bold) t.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  return t;
              }
              private LinearLayout vertical() {
                  LinearLayout l = new LinearLayout(this); l.setOrientation(LinearLayout.VERTICAL); return l;
              }
              private Button button(String label, Runnable action) {
                  Button b = new Button(this); b.setText(label); b.setTextColor(WHITE);
                  b.setBackgroundTintList(android.content.res.ColorStateList.valueOf(PURPLE));
                  b.setOnClickListener(v -> action.run()); return b;
              }
              private void render() {
                  LinearLayout root = vertical(); root.setBackgroundColor(BG);
                  root.setPadding(dp(18),dp(22),dp(18),dp(12));
                  setContentView(root);
                  TextView title = text("SPY VAULT HOME",22,WHITE,true); root.addView(title);
                  TextView subtitle = text("Choose which apps appear in this launcher",12,MUTED,false);
                  LinearLayout.LayoutParams sm = new LinearLayout.LayoutParams(-1,-2); sm.topMargin=dp(5); root.addView(subtitle,sm);
                  Button home = button("SET AS DEFAULT HOME", () -> {
                      try { startActivity(new Intent(Settings.ACTION_HOME_SETTINGS)); }
                      catch(Exception e) { startActivity(new Intent(Settings.ACTION_SETTINGS)); }
                  });
                  LinearLayout.LayoutParams hm = new LinearLayout.LayoutParams(-1,-2); hm.topMargin=dp(12); root.addView(home,hm);
                  LinearLayout tabs = new LinearLayout(this); tabs.setOrientation(LinearLayout.HORIZONTAL);
                  Button all = button("ALL APPS",()->{showHidden=false;refresh();});
                  Button hid = button("HIDDEN ("+hidden.size()+")",()->{showHidden=true;refresh();});
                  LinearLayout.LayoutParams half = new LinearLayout.LayoutParams(0,-2,1); half.setMargins(0,dp(8),dp(4),dp(8)); tabs.addView(all,half);
                  LinearLayout.LayoutParams half2 = new LinearLayout.LayoutParams(0,-2,1); half2.setMargins(dp(4),dp(8),0,dp(8)); tabs.addView(hid,half2);
                  root.addView(tabs);
                  search = new EditText(this); search.setSingleLine(true); search.setTextColor(WHITE);
                  search.setHintTextColor(MUTED); search.setHint("Search apps"); search.setBackgroundColor(PANEL);
                  search.setPadding(dp(12),dp(8),dp(12),dp(8)); root.addView(search);
                  ScrollView scroll = new ScrollView(this); list = vertical();
                  list.setPadding(0,dp(8),0,dp(20)); scroll.addView(list);
                  LinearLayout.LayoutParams sl = new LinearLayout.LayoutParams(-1,0,1); sl.topMargin=dp(6); root.addView(scroll,sl);
                  search.addTextChangedListener(new android.text.TextWatcher() {
                      public void beforeTextChanged(CharSequence s,int st,int c,int a) {}
                      public void onTextChanged(CharSequence s,int st,int before,int count) { populate(); }
                      public void afterTextChanged(android.text.Editable e) {}
                  });
                  populate();
              }
              private void refresh() { render(); }
              private void populate() {
                  if (list == null) return;
                  list.removeAllViews();
                  String q = search == null ? "" : search.getText().toString().toLowerCase(Locale.ROOT);
                  int count=0;
                  for (ResolveInfo ri : apps) {
                      String pkg = ri.activityInfo.packageName;
                      boolean isHidden = hidden.contains(pkg);
                      if (showHidden != isHidden) continue;
                      String label = String.valueOf(ri.loadLabel(getPackageManager()));
                      if (!label.toLowerCase(Locale.ROOT).contains(q) && !pkg.toLowerCase(Locale.ROOT).contains(q)) continue;
                      addAppRow(ri,label,pkg,isHidden); count++;
                  }
                  if (count==0) {
                      TextView empty=text(showHidden?"No hidden apps":"No apps found",14,MUTED,false);
                      empty.setGravity(Gravity.CENTER); empty.setPadding(0,dp(30),0,dp(30)); list.addView(empty);
                  }
              }
              private void addAppRow(ResolveInfo ri,String label,String pkg,boolean isHidden) {
                  LinearLayout row = new LinearLayout(this); row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setGravity(Gravity.CENTER_VERTICAL); row.setBackgroundColor(PANEL);
                  row.setPadding(dp(10),dp(9),dp(8),dp(9));
                  LinearLayout.LayoutParams rp = new LinearLayout.LayoutParams(-1,-2); rp.bottomMargin=dp(7); list.addView(row,rp);
                  ImageView icon = new ImageView(this);
                  try { icon.setImageDrawable(ri.loadIcon(getPackageManager())); } catch(Exception ignored) {}
                  row.addView(icon,new LinearLayout.LayoutParams(dp(42),dp(42)));
                  LinearLayout info=vertical(); info.setPadding(dp(10),0,dp(5),0);
                  TextView name=text(label,14,WHITE,true); info.addView(name);
                  TextView packageName=text(pkg,9,MUTED,false); info.addView(packageName);
                  LinearLayout.LayoutParams ip=new LinearLayout.LayoutParams(0,-2,1); row.addView(info,ip);
                  Button action = new Button(this); action.setText(isHidden?"UNHIDE":"HIDE");
                  action.setTextSize(10); action.setTextColor(WHITE);
                  action.setBackgroundTintList(android.content.res.ColorStateList.valueOf(isHidden?Color.rgb(40,150,105):PURPLE));
                  action.setOnClickListener(v -> {
                      if (isHidden) hidden.remove(pkg); else hidden.add(pkg);
                      getPreferences(0).edit().putStringSet("hidden_packages",new HashSet<>(hidden)).apply();
                      Toast.makeText(this,isHidden?"App restored in SPY VAULT Home":"App hidden from SPY VAULT Home",Toast.LENGTH_SHORT).show();
                      populate();
                  });
                  row.addView(action,new LinearLayout.LayoutParams(dp(88),dp(44)));
                  if (!isHidden) {
                      row.setOnClickListener(v -> {
                          try { Intent launch=getPackageManager().getLaunchIntentForPackage(pkg); if(launch!=null) startActivity(launch); }
                          catch(Exception e) { Toast.makeText(this,"Unable to open app",Toast.LENGTH_SHORT).show(); }
                      });
                  }
              }
          }
          """
          (app / "src/main/java/com/spyvault/app/AppHiderActivity.java").write_text(activity)

          manifest = app / "src/main/AndroidManifest.xml"
          m = manifest.read_text()
          if "<queries>" not in m:
              m = m.replace('<application', '''<queries>
                  <intent><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent>
              </queries>
              <application''',1)
          if 'android:name=".AppHiderActivity"' not in m:
              m = m.replace('</application>', '''<activity android:name=".AppHiderActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.HOME"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                      </intent-filter>
                  </activity>
              </application>''')
          manifest.write_text(m)

          gradle = app / "build.gradle"
          g = gradle.read_text().replace("versionCode 24","versionCode 25").replace("versionCode 23","versionCode 25").replace("versionName '0.9.3'","versionName '0.9.6'")
          gradle.write_text(g)

          if "AppHiderActivity" not in manifest.read_text() or "hidden_packages" not in (app / "src/main/java/com/spyvault/app/AppHiderActivity.java").read_text():
              raise SystemExit("App Hider integration verification failed")
          print("Integrated real launcher app drawer with hide/unhide persistence.")
          PY

      - name: Build original SPY VAULT
        run: |
          set -euo pipefail
          gradle -p source/SPY_VAULT_0.9.3 --no-daemon clean assembleDebug --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          APK=source/SPY_VAULT_0.9.3/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/aapt" dump badging "$APK" | grep "package: name='com.spyvault.app'"
          "$ANDROID_HOME/build-tools/$BT/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -q AppHiderActivity
          sha256sum "$APK"

      - name: Upload SPY VAULT 0.9.6 APK
        uses: actions/upload-artifact@v4
        with:
          name: SPY-VAULT-0.9.6-real-app-hider-debug-apk
          path: source/SPY_VAULT_0.9.3/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
