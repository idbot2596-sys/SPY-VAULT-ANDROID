name: SPY VAULT Original Java Build

'on':
  workflow_dispatch:
  push:
    paths:
      - SPY_VAULT_0.9.3_Source.zip
      - .github/workflows/spy-vault-original.yml

permissions:
  contents: read

jobs:
  build-original:
    name: Build original SPY VAULT Java app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract original source archive
        shell: bash
        run: |
          set -euo pipefail
          unzip -q SPY_VAULT_0.9.3_Source.zip -d source
          test -f source/SPY_VAULT_0.9.3/app/src/main/java/com/spyvault/app/MainActivity.java
          test -f source/SPY_VAULT_0.9.3/app/build.gradle

      - name: Build original Java application
        shell: bash
        run: |
          set -euo pipefail
          gradle -p source/SPY_VAULT_0.9.3 --no-daemon clean assembleDebug --stacktrace

      - name: Verify package and APK
        shell: bash
        run: |
          set -euo pipefail
          APK=source/SPY_VAULT_0.9.3/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          file "$APK"
          sha256sum "$APK"
          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt dump badging "$APK" | grep -E "package: name='com.spyvault.app'"

      - name: Upload original SPY VAULT APK
        uses: actions/upload-artifact@v4
        with:
          name: SPY-VAULT-original-java-debug-apk
          path: source/SPY_VAULT_0.9.3/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
